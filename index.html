<!DOCTYPE html>
<html>
<head>

<title>LAUGH VILLAGE ULTRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

.card video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.card-info{padding:12px}
.card-info h3{font-size:16px}
.card-info p{font-size:13px;color:#555;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.bottom button{border:none;background:none;font-size:12px;color:#888}
.bottom button.active{color:#FF6B00;font-weight:bold}

</head>
<body>

<div class="header">
  <h1>🏘️ LAUGH VILLAGE ULTRA</h1>
  <p style="font-size:12px">Stronger Together - Real Village, Real Laughs</p>
</div>

<div class="feed">

  <div class="card">
    <video src="videos/village1.mp4" controls poster=""></video>
    <div class="card-info">
      <h3>@Mama's Hut 😂 - Morning Chaos</h3>
      <p>Real life in the village, no filter. 12K laughs ❤️</p>
    </div>
  </div>

  <div class="card">
    <video src="videos/village2.mp4" controls></video>
    <div class="card-info">
      <h3>@Uncle Tries Football ⚽</h3>
      <p>He said he's Ronaldo... look what happened 💀</p>

  </div>

</div>

<div class="bottom">
  <button class="active">🏠<br>Village</button>

  <button style="background:#FF6B00;color:white;width:50px;height:50px;border-radius:50%;font-size:25px">+</button>

  <button>👤<br>Me</button>

</body>
</html>
