<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAUGH VILLAGE ULTRA - Stronger Together</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family: Arial, sans-serif; overflow:hidden; }
.feed {
  height:100vh;
  width:100vw;
  overflow-y:scroll;
  scroll-snap-type: y mandatory;
}
.post {
  height:100vh;
  width:100vw;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}
.post video, .post iframe {
  height:100%;
  width:100%;
  object-fit:cover;
  position:absolute;
  top:0; left:0;
}
.overlay {
  position:absolute;
  bottom:0; left:0; right:60px;
  padding:20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color:white;
  z-index:2;
}
.overlay h3 { font-size:18px; margin-bottom:5px; }
.overlay p { font-size:14px; opacity:0.9; }
.actions {
  position:absolute;
  right:10px;
  bottom:80px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:25px;
  align-items:center;
}
.action-btn {
  width:50px; height:50px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  backdrop-filter:blur(10px);
  cursor:pointer;
  border:none;
  color:white;
}
.action-btn:active { transform:scale(0.9); }
.likes { color:white; font-size:12px; margin-top:-20px; font-weight:bold; }
.top-bar {
  position:fixed;
  top:0; left:0; right:0;
  z-index:10;
  padding:15px;
  display:flex;
  justify-content:space-between;
  color:white;
  background: linear-gradient(rgba(0,0,0,0.6), transparent);
}
.logo { font-weight:900; letter-spacing:1px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">LAUGH VILLAGE ULTRA 😂</div>
  <div>🔍</div>
</div>

<div class="feed" id="feed">

  <!-- VIDEO 1 - CHANGE SRC TO YOUR VIDEO -->
  <div class="post">
    <video src="videos/village1.mp4" loop autoplay muted playsinline onclick="this.muted=false"></video>
    <div class="overlay">
      <h3>@laughvillageultra</h3>
      <p>Real village life 😂 Day 1 - Stronger Together! #village #funny</p>
      <p>🎵 Original Sound - Laugh Village</p>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="like(this)">❤️</button>
      <span class="likes">12.5K</span>
      <button class="action-btn">💬</button>
      <span class="likes">892</span>
      <button class="action-btn">↗️</button>
      <button class="action-btn">⋯</button>
    </div>
  </div>

  <!-- VIDEO 2 - YOUTUBE EXAMPLE -->
  <div class="post">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=0&loop=1&mute=1&autoplay=1" allow="autoplay"></iframe>
    <div class="overlay">
      <h3>@laughvillageultra</h3>
      <p>When uncle tries TikTok dance 💀 #ultra</p>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="like(this)">❤️</button>
      <span class="likes">8.2K</span>
      <button class="action-btn">💬</button>
      <button class="action-btn">↗️</button>
    </div>
  </div>

  <!-- VIDEO 3 -->
  <div class="post">
    <video src="videos/village2.mp4" loop autoplay muted playsinline onclick="this.muted=false"></video>
    <div class="overlay">
      <h3>@laughvillageultra</h3>
      <p>POV: You live in Laugh Village 😂</p>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="like(this)">❤️</button>
      <span class="likes">22K</span>
      <button class="action-btn">💬</button>
      <button class="action-btn">↗️</button>
    </div>
  </div>

</div>

<script>
function like(btn){
  if(btn.innerText === '❤️'){ btn.innerText='💖'; btn.style.background='rgba(255,0,0,0.5)'; }
  else { btn.innerText='❤️'; btn.style.background='rgba(255,255,255,0.2)'; }
}
// Auto play video when visible like TikTok
const videos = document.querySelectorAll('video');
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.play(); } else { e.target.pause(); }
  });
},{threshold:0.7});
videos.forEach(v=>observer.observe(v));
</script>

</body>
</html>
