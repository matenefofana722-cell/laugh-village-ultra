<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUGH VILLAGE ULTRA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:Arial; overflow:hidden; }
.feed { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; }
.post { height:100vh; width:100%; position:relative; scroll-snap-align:start; background:#000; }
.post video { width:100%; height:100%; object-fit:cover; }
.overlay { position:absolute; bottom:0; left:0; right:80px; padding:20px; color:white; background:linear-gradient(transparent, black); }
.actions { position:absolute; right:10px; bottom:100px; display:flex; flex-direction:column; gap:20px; }
.btn { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,0.15); border:none; font-size:26px; color:white; }
</style>
</head>
<body>

<div class="feed">

  <div class="post">
    <video src="videos/village1.mp4" loop muted playsinline></video>
    <div class="overlay">
      <h3>@laughvillageultra</h3>
      <p>Real village life 😂 #ultra</p>
    </div>
    <div class="actions">
      <button class="btn">❤️</button>
      <button class="btn">💬</button>
      <button class="btn">↗️</button>
    </div>
  </div>

  <div class="post">
    <video src="videos/village2.mp4" loop muted playsinline></video>
    <div class="overlay">
      <h3>@laughvillageultra</h3>
      <p>Day 2 in village 🔥</p>
    </div>
    <div class="actions">
      <button class="btn">❤️</button>
      <button class="btn">💬</button>
      <button class="btn">↗️</button>
    </div>
  </div>

</div>

<script>
// ONLY ONE VIDEO PLAYS - LIKE TIKTOK
const videos = document.querySelectorAll('video');
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      videos.forEach(v=>{ v.pause(); v.muted=true; });
      entry.target.muted=false;
      entry.target.play();
    }
  });
}, {threshold:0.8});

videos.forEach(v=>observer.observe(v));

// Tap to mute/unmute
videos.forEach(v=>{
  v.addEventListener('click', ()=>{
    v.muted = !v.muted;
  });
});
</script>

</body>
</html>
